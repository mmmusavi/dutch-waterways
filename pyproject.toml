[project]
name = "dutch-waterways"
version = "0.1.0.dev0"
description = "Route planner for Dutch inland waterways, built on Rijkswaterstaat's open FIS network"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MirMohammad Musavi" }]
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14",
    "networkx>=3.0",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyproj>=3.6",
    "requests>=2.31",
    "shapely>=2.0",
]

[project.optional-dependencies]
map = ["folium>=0.15"]

[project.scripts]
dutch-waterways = "dutch_waterways.cli:main"

[dependency-groups]
dev = ["pytest>=8", "folium>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["online: needs network access to Rijkswaterstaat's FIS service"]
addopts = "-m 'not online'"
